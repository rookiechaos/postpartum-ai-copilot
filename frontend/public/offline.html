<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オフライン | 産後のくらしサポート</title>
  <style>
    body { margin: 0; padding: 24px; background: #edf4ef; color: #213b35; font-family: system-ui, sans-serif; line-height: 1.9; }
    main { max-width: 640px; margin: 32px auto; padding: 28px; border-radius: 18px; background: white; }
    h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; }
    a, button { display: inline-block; min-height: 44px; box-sizing: border-box; padding: 10px 18px; border: 1px solid #256354; border-radius: 10px; color: #fff; background: #256354; font: inherit; }
    .source { background: transparent; color: #256354; }
    a:focus-visible, button:focus-visible { outline: 3px solid #2b8270; outline-offset: 3px; }
  </style>
</head>
<body><main>
  <h1>インターネットに接続できません</h1>
  <p>記録の保存やAIの回答には接続が必要です。接続を確認して、もう一度お試しください。</p>
  <button onclick="window.location.reload()">もう一度試す / Retry</button>
  <h2>日本で救急車が必要なとき / Ambulance in Japan</h2>
  <p>AIの回答を待たずに、119へ直接連絡してください。</p>
  <a href="tel:119">119に電話する / Call 119</a>
  <h2>子ども医療電話相談 / Child medical advice</h2>
  <p>#8000の受付時間は都道府県により異なります。</p>
  <a href="tel:%238000">#8000に電話する</a>
  <p><a class="source" href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/newpage_55223.html">接続回復後、厚生労働省で受付時間を確認</a></p>
  <p>#7119は実施地域・対象年齢・受付時間が異なります。接続回復後、<a class="source" href="https://www.fdma.go.jp/mission/enrichment/appropriate/appropriate007.html">消防庁の案内</a>をご確認ください。</p>
</main></body>
</html>
