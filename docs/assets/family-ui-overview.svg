  <text x="118" y="66" class="label center" fill="#256354">家庭で使う</text>
  <text x="60" y="125" font-size="37" class="title">毎日の記録を、迷わず、ひとつずつ。</text>
  <text x="61" y="156" font-size="16" class="muted">今から記録する相手を確認して、押す。最近の記録で、確かめる。</text>

