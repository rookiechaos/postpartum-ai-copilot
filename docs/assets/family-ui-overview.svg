<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title description">
  <title id="title">家庭版のUIデザイン模式図：きょうの記録を中心にしたデスクトップとスマートフォン</title>
  <desc id="description">架空の「あおちゃん」の例。デスクトップは上部の五つのナビゲーション、スマートフォンは下部の五つのナビゲーションを使います。今から記録する相手と本人だけの共有範囲、二列の記録ボタン、本人の最近の記録を順に配置しています。AIに聞く機能と、人に相談する相談先を区別しています。実行画面のスクリーンショットではありません。</desc>
  <defs>
    <style>
      svg{fill:#213b35}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
      .muted{fill:#617169}.small{font-size:13px}.body{font-size:15px}.label{font-size:14px;font-weight:600}.title{font-weight:650}.line{stroke:#dfe5de;stroke-width:1}.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:#256354}.center{text-anchor:middle}
    </style>
    <filter id="paper" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#213b35" flood-opacity=".07"/></filter>
  </defs>
  <rect width="1400" height="1120" fill="#f6f5f0"/>
